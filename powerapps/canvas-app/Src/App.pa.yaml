App:
  Properties:
    OnStart: |-
      =   Set(varMe, User());
         Set(varToday, Today());
         Set(varRoles, IfError(With({r: Concat(Filter('IA Configuration', StartsWith(Title, "Role."), !IsBlank(Find(";" & Lower(User().Email) & ";", Lower(ConfigValue)))), Mid(Title, 6) & ",")}, If(IsBlank(r), "None", "," & r)), "None"));
         Set(varIsOwner, "," & "Owner" & "," in varRoles);
         Set(varIsManager, ("," & "Manager" & "," in varRoles) || varIsOwner);
         Set(varIsAuditor, ("," & "Auditor" & "," in varRoles) || varIsManager);
         Set(varIsActionOwner, "," & "ActionOwner" & "," in varRoles);
         Set(varIsExec, "," & "Executive" & "," in varRoles);
         Set(varIsBUHead, "," & "BUHead" & "," in varRoles);
         Set(varIsDeptHead, "," & "DepartmentHead" & "," in varRoles);
         Set(varIsMgmt, varIsActionOwner || varIsBUHead || varIsDeptHead);
         Set(varHasAccess, varRoles <> "None" || CountRows(Filter('Questionnaire Sections', Lower(Assignee.Email) = Lower(User().Email))) > 0);
         If(!varHasAccess, Blank(), varIsAuditor || varIsExec, Blank(), Blank());
         Set(varBrand, RGBA(18,35,59,1));
         Set(varGreen, RGBA(47,107,79,1));
         Set(varAmber, RGBA(154,107,18,1));
         Set(varRed, RGBA(142,43,43,1));
         Set(varGold, RGBA(184,151,90,1));
         Set(varIvory, RGBA(247,244,236,1));
         Set(varStone, RGBA(230,224,210,1));
         ClearCollect(colEntities, Entities);
         ClearCollect(colDepartments, Departments)   ;
         Set(varEngItem, First('Audit Engagements'));
      Set(varPlanItem, First('Annual Audit Plan'));
      Set(varFindingItem, First('Audit Findings Register'));
      Set(varActionItem, First('Corrective Action Tracker'));
      Set(varFollowUpItem, First('Follow-Up Reviews')) ;Set(varIsAuditee, CountRows(Filter('Questionnaire Sections', Assignee.Email = Lower(User().Email))) > 0);
    StartScreen: =If(!varHasAccess, scrNoAccess, varIsAuditor || varIsExec, scrDashboard, scrActions)
    Theme: =PowerAppsTheme
