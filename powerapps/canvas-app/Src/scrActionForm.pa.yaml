Screens:
  scrActionForm:
    Properties:
      Fill: =RGBA(247, 244, 236, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - conActionForm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conActionFormHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 35, 59, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                Children:
                  - lblActionFormTitle:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.Georgia
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Text: =If(frmAction.Mode = FormMode.New, "New corrective action", "Edit corrective action")
                  - btnActionFormSave:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(184, 151, 90, 1)
                        BorderThickness: =1
                        Color: =RGBA(18, 35, 59, 1)
                        Fill: =RGBA(184, 151, 90, 1)
                        Font: =Font.'Segoe UI'
                        HoverFill: =RGBA(217, 199, 158, 1)
                        OnSelect: =SubmitForm(frmAction)
                        Text: ="SAVE"
                        Width: =110
                  - btnActionFormCancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(184, 151, 90, 1)
                        BorderThickness: =1
                        Color: =RGBA(247, 244, 236, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        HoverFill: =RGBA(27, 50, 80, 1)
                        OnSelect: =ResetForm(frmAction); Navigate(scrActions, ScreenTransition.None)
                        Text: ="CANCEL"
                        Width: =110
            - frmAction:
                Control: Form@2.4.4
                Layout: Vertical
                Properties:
                  DataSource: ='Corrective Action Tracker'
                  DefaultMode: =FormMode.New
                  Fill: =RGBA(247, 244, 236, 1)
                  Item: =varActionItem
                  NumberOfColumns: =2
                  OnFailure: =Notify(frmAction.Error, NotificationType.Error)
                  OnSuccess: =Notify("Action saved", NotificationType.Success); Navigate(scrActions, ScreenTransition.None)
