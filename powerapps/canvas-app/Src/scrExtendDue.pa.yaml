Screens:
  scrExtendDue:
    Properties:
      Fill: =RGBA(247,244,236,1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - Label1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Height: =50
            Size: =24
            Text: ="Request due-date extension"
            Width: =900
            X: =40
            Y: =40
      - Label2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Size: =16
            Text: |-
              =varActionItem.'Action Title' & "   |   Current due date: " & Text(varActionItem.'Due Date', "dd mmm yyyy")
            Width: =900
            X: =40
            Y: =100
      - DatePicker1:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Color: =RGBA(50, 49, 48, 1)
            DefaultDate: =DateAdd(varActionItem.'Due Date', 30, TimeUnit.Days)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(245, 245, 245, 1)
            Font: =Font.'Segoe UI'
            IconBackground: =RGBA(0, 120, 212, 1)
            IconFill: =RGBA(255, 255, 255, 1)
            PaddingTop: =5
            Size: =13
            X: =40
            Y: =170
      - TextInput1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Color: =RGBA(50, 49, 48, 1)
            Default: =""
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Font: =Font.'Segoe UI'
            HintText: ="Reason for the extension"
            HoverBorderColor: =RGBA(16, 110, 190, 1)
            HoverColor: =RGBA(50, 49, 48, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =RGBA(0, 120, 212, 1)
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =700
            X: =40
            Y: =230
      - Button2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =If(IsBlank(TextInput1.Text), Notify("Please enter a reason.", NotificationType.Warning), DatePicker1.SelectedDate <= varActionItem.'Due Date', Notify("The new due date must be later than the current due date.", NotificationType.Warning), IfError(Set(varExtResult, 'IAMS-WF6-DueDateExtension'.Run("Action", Text(varActionItem.ID), Text(DatePicker1.SelectedDate, "yyyy-mm-dd"), TextInput1.Text, User().Email).result); Notify(varExtResult, NotificationType.Success); Back(), Notify("Could not submit the request. Please try again.", NotificationType.Error)))
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="SUBMIT FOR APPROVAL"
            Width: =260
            X: =40
            Y: =300
      - Button3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =Back()
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="BACK"
            X: =320
            Y: =300
