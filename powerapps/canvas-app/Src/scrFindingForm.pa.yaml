                      Variant: ComboBoxEdit
                      IsLocked: true
                      Properties:
                        BorderColor: =RGBA(230, 224, 210, 1)
                        DataField: ="FindingStatus"
                        Default: =ThisItem.Status
                        DisplayName: =DataSourceInfo([@'Audit Findings Register'],DataSourceInfo.DisplayName,Status)
                        Required: =false
                        Update: =DataCardValue25.Selected
                        Width: =400
                        X: =0
                        Y: =0
