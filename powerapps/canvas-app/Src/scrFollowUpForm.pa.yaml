      - conFollowUpForm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conFollowUpFormHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 35, 59, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                Children:
                  - lblFollowUpFormTitle:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.Georgia
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Text: =If(frmFollowUp.Mode = FormMode.New, "New follow-up review", "Edit follow-up review")
                  - btnFollowUpFormSave:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(184, 151, 90, 1)
                        BorderThickness: =1
                        Color: =RGBA(18, 35, 59, 1)
                        Fill: =RGBA(184, 151, 90, 1)
                        Font: =Font.'Segoe UI'
                        HoverFill: =RGBA(217, 199, 158, 1)
                        OnSelect: =SubmitForm(frmFollowUp)
                        Text: ="SAVE"
                        Width: =110
                  - btnFollowUpFormCancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(184, 151, 90, 1)
                        BorderThickness: =1
                        Color: =RGBA(247, 244, 236, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        HoverFill: =RGBA(27, 50, 80, 1)
                        OnSelect: =ResetForm(frmFollowUp); Navigate(scrFollowUp, ScreenTransition.None)
                        Text: ="CANCEL"
                        Width: =110
