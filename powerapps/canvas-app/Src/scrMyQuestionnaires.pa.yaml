                  X: =460
                  Y: =10
            - chSChip_2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =Switch(ThisItem.SectionStatus.Value,"Draft",RGBA(107, 114, 128, 1),"Not started",RGBA(107, 114, 128, 1),"Issued",RGBA(154, 107, 18, 1),"In Progress",RGBA(154, 107, 18, 1),"In progress",RGBA(154, 107, 18, 1),"Under Review",RGBA(154, 107, 18, 1),"Submitted",RGBA(154, 107, 18, 1),"Pending",RGBA(107, 114, 128, 1),"Returned",RGBA(142, 43, 43, 1),"Accepted",RGBA(47, 107, 79, 1),"Closed",RGBA(47, 107, 79, 1),RGBA(107, 114, 128, 1))
