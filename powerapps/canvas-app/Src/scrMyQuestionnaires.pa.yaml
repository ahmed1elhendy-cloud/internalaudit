                  Size: =14
                  Text: =ThisItem.Title
                  Width: =420
                  X: =16
                  Y: =28
            - lblDue:
                Control: Label@2.5.1
                Properties:
                  Color: =If(!IsBlank(ThisItem.DueDate) && ThisItem.DueDate<Today() && !(ThisItem.SectionStatus.Value in ["Submitted","Accepted"]),RGBA(142, 43, 43, 1),RGBA(29, 37, 48, 1))
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =48
                  Size: =12
                  Text: |-
                    ="Due: " & If(IsBlank(ThisItem.DueDate),"—",Text(ThisItem.DueDate,"dd mmm yyyy")) & If(!IsBlank(ThisItem.DueDate) && ThisItem.DueDate<Today() && !(ThisItem.SectionStatus.Value in ["Submitted","Accepted"]),"   ⚠ OVERDUE","")
