          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(230, 224, 210, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 208
            Items: =SortByColumns(Filter('Questionnaire Sections', Assignee.Email=Lower(User().Email), !(SectionStatus.Value in ["Accepted"])),"DueDate")
            OnSelect: =Set(varSec, ThisItem); Navigate(scrQuestionnaireFill, ScreenTransition.None)
            TemplatePadding: =0
            TemplateSize: =68
            Width: =Parent.Width - 48
            X: =24
            Y: =192
