            Size: =11
            Text: =Upper("Refresh")
            Width: =110
            X: =Parent.Width - 280
            Y: =Parent.Height - 62
      - btnSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(184, 151, 90, 1)
            BorderThickness: =1
            Color: =RGBA(247, 244, 236, 1)
            DisplayMode: =If(!(varSec.SectionStatus.Value in ["Submitted","Accepted"]) && CountRows(Filter('Questionnaire Items', Section.Id=varSec.ID, IsBlank(Answer.Value) || (Answer.Value="No" && ExplanationRequiredIfNo && IsBlank(Explanation))))=0, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(18, 35, 59, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            HoverColor: =RGBA(247, 244, 236, 1)
            HoverFill: =RGBA(27, 50, 80, 1)
            OnSelect: =Patch('Questionnaire Sections', varSec, {SectionStatus:{Value:"Submitted"}, SubmittedDate:Now()}); Patch('Audit Questionnaires', LookUp('Audit Questionnaires', ID=varSec.Questionnaire.Id), {QuestionnaireStatus:{Value:If(CountRows(Filter('Questionnaire Sections', Questionnaire.Id=varSec.Questionnaire.Id, !(SectionStatus.Value in ["Submitted","Accepted"])))=0,"Under Review","In Progress")}}); Notify("Section submitted", NotificationType.Success); Navigate(scrMyQuestionnaires, ScreenTransition.None)
            PressedColor: =RGBA(247, 244, 236, 1)
            PressedFill: =RGBA(27, 50, 80, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: =Upper("Submit section")
            Width: =136
            X: =Parent.Width - 160
            Y: =Parent.Height - 62
      - lblSubHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            Size: =10
            Text: ="Submit unlocks when every question is answered (and explained when the answer is No)."
            Width: =Parent.Width - 330
            X: =24
            Y: =Parent.Height - 62
      - btnSaveLater:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(184, 151, 90, 1)
            BorderThickness: =1
            Color: =RGBA(18, 35, 59, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Segoe UI'
            Height: =42
            HoverColor: =RGBA(18, 35, 59, 1)
            HoverFill: =RGBA(251, 249, 243, 1)
            OnSelect: =Notify("Answers are saved as you go. Come back any time.", NotificationType.Success); Navigate(scrMyQuestionnaires, ScreenTransition.None)
            PressedColor: =RGBA(18, 35, 59, 1)
            PressedFill: =RGBA(251, 249, 243, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: =Upper("Save for later")
            Width: =116
            X: =Parent.Width - 420
            Y: =Parent.Height - 62
      - Icon15:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(216, 180, 90, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =24
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Reload
            OnSelect: =Refresh('Annual Audit Plan'); Refresh('Audit Engagements'); Refresh('Audit Findings Register'); Refresh('Corrective Action Tracker'); Refresh('Follow-Up Reviews'); Refresh('Engagement Milestones'); Refresh('Audit Questionnaires'); Refresh('Questionnaire Sections'); Refresh('Questionnaire Items'); Refresh('Questionnaire Uploads'); Refresh('Audit Working Papers'); Refresh('Evidence Repository'); Refresh('Audit Trail'); Refresh('IA Configuration'); Notify("Data refreshed", NotificationType.Success)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Tooltip: ="Refresh data"
            Width: =24
            X: =1274
            Y: =40
