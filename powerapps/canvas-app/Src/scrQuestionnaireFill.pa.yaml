            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: =Upper("← Back")
            Width: =112
            X: =Parent.Width - 136
            Y: =100
      - lblProg:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(29, 37, 48, 1)
            Font: =Font.'Segoe UI'
            Height: =30
            Size: =12
            Text: ="Answered " & CountRows(Filter('Questionnaire Items', Section.Id=varSec.ID, !IsBlank(Answer.Value))) & " of " & CountRows(Filter('Questionnaire Items', Section.Id=varSec.ID)) & "   |   Due " & Text(varSec.DueDate,"dd mmm yyyy")
            Width: =Parent.Width - 300
            X: =24
            Y: =154
      - recProgBg_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(230, 224, 210, 1)
            Height: =4
            Width: =Parent.Width - 48
            X: =24
            Y: =184
      - recProg_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(184, 151, 90, 1)
            Height: =4
            Width: =(Parent.Width - 48) * Min(1, Max(0, CountRows(Filter('Questionnaire Items', Section.Id=varSec.ID, !IsBlank(Answer.Value))) / Max(1, CountRows(Filter('Questionnaire Items', Section.Id=varSec.ID)))))
            X: =24
            Y: =184
      - galItems:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Fill: =RGBA(247, 244, 236, 1)
            Height: =Parent.Height - 270
            Items: =SortByColumns(Filter('Questionnaire Items',Section.Id=varSec.ID),"SortOrder")
            TemplatePadding: =6
            TemplateSize: =152
            Width: =Parent.Width - 48
            X: =24
            Y: =193
          Children:
            - recCard_1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(230, 224, 210, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Parent.TemplateHeight - 12
                  Width: =Parent.TemplateWidth - 12
            - recEdge_4:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Answer.Value="Yes",RGBA(47, 107, 79, 1),ThisItem.Answer.Value="No",RGBA(142, 43, 43, 1),RGBA(230, 224, 210, 1))
                  Height: =Parent.TemplateHeight - 12
                  Width: =3
            - lblNo:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(184, 151, 90, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =12
                  Text: ="Q" & ThisItem.SortOrder
                  Width: =60
                  X: =16
                  Y: =6
            - lblQ:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(29, 37, 48, 1)
                  Font: =Font.Georgia
                  Height: =48
                  Size: =15
                  Text: =ThisItem.Question
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 420
                  X: =70
                  Y: =6
            - lblHint:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 114, 128, 1)
                  Font: =Font.'Segoe UI'
                  Height: =22
                  Size: =10
                  Text: |-
                    ="Evidence: " & Coalesce(ThisItem.AttachmentRequirement,"") & " (" & ThisItem.EvidenceRule.Value & ")"
                  Width: =Parent.TemplateWidth - 420
                  X: =70
                  Y: =56
            - lblRet:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(142, 43, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =11
                  Text: |-
                    =If(ThisItem.ReviewStatus.Value="Returned","↩ Returned: " & ThisItem.ReviewerComment,"")
                  Width: =Parent.TemplateWidth - 420
                  X: =70
                  Y: =78
            - btnYes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(ThisItem.Answer.Value="Yes",RGBA(47, 107, 79, 1),RGBA(230, 224, 210, 1))
                  BorderThickness: =1
                  Color: =If(ThisItem.Answer.Value="Yes",RGBA(255, 255, 255, 1),RGBA(107, 114, 128, 1))
                  DisplayMode: =If(varSec.SectionStatus.Value in ["Submitted","Accepted"],DisplayMode.Disabled,DisplayMode.Edit)
                  Fill: =If(ThisItem.Answer.Value="Yes",RGBA(47, 107, 79, 1),RGBA(255, 255, 255, 1))
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverColor: =RGBA(18, 35, 59, 1)
                  HoverFill: =If(ThisItem.Answer.Value="Yes",RGBA(47, 107, 79, 1),RGBA(251, 249, 243, 1))
                  OnSelect: =Patch('Questionnaire Items', ThisItem, {Answer:{Value:"Yes"}, ReviewStatus:{Value:"Pending"}})
                  PressedColor: =RGBA(18, 35, 59, 1)
                  PressedFill: =RGBA(251, 249, 243, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =11
                  Text: ="Yes"
                  Width: =80
                  X: =Parent.TemplateWidth - 330
                  Y: =10
            - btnNo:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(ThisItem.Answer.Value="No",RGBA(142, 43, 43, 1),RGBA(230, 224, 210, 1))
                  BorderThickness: =1
                  Color: =If(ThisItem.Answer.Value="No",RGBA(255, 255, 255, 1),RGBA(107, 114, 128, 1))
                  DisplayMode: =If(varSec.SectionStatus.Value in ["Submitted","Accepted"],DisplayMode.Disabled,DisplayMode.Edit)
                  Fill: =If(ThisItem.Answer.Value="No",RGBA(142, 43, 43, 1),RGBA(255, 255, 255, 1))
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverColor: =RGBA(18, 35, 59, 1)
                  HoverFill: =If(ThisItem.Answer.Value="No",RGBA(142, 43, 43, 1),RGBA(251, 249, 243, 1))
                  OnSelect: =Patch('Questionnaire Items', ThisItem, {Answer:{Value:"No"}, ReviewStatus:{Value:"Pending"}})
                  PressedColor: =RGBA(18, 35, 59, 1)
                  PressedFill: =RGBA(251, 249, 243, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =11
                  Text: ="No"
                  Width: =80
                  X: =Parent.TemplateWidth - 240
                  Y: =10
            - btnEvid:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(184, 151, 90, 1)
                  BorderThickness: =1
                  Color: =RGBA(18, 35, 59, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverColor: =RGBA(18, 35, 59, 1)
                  HoverFill: =RGBA(251, 249, 243, 1)
                  OnSelect: =Launch("https://YOURTENANT.sharepoint.com/sites/InternalAuditTest/Lists/IA_QnrItems/EditForm.aspx?ID=" & ThisItem.ID)
                  PressedColor: =RGBA(18, 35, 59, 1)
                  PressedFill: =RGBA(251, 249, 243, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =11
                  Text: =Upper("Attach evidence")
                  Visible: =ThisItem.EvidenceRule.Value<>"Never"
                  Width: =136
                  X: =Parent.TemplateWidth - 150
                  Y: =10
            - txtExpl:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(230, 224, 210, 1)
                  BorderThickness: =1
                  Color: =RGBA(29, 37, 48, 1)
                  Default: =ThisItem.Explanation
                  DisplayMode: =If(varSec.SectionStatus.Value in ["Submitted","Accepted"],DisplayMode.Disabled,DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HintText: =If(ThisItem.Answer.Value="No","Explanation (required)","Explanation (optional)")
                  OnChange: =Patch('Questionnaire Items', ThisItem, {Explanation:txtExpl.Text})
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =12
                  Width: =Parent.TemplateWidth - 520
                  X: =70
                  Y: =106
            - txtDoc:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(230, 224, 210, 1)
                  BorderThickness: =1
                  Color: =RGBA(29, 37, 48, 1)
                  Default: =ThisItem.DocumentRef
                  DisplayMode: =If(varSec.SectionStatus.Value in ["Submitted","Accepted"],DisplayMode.Disabled,DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HintText: ="Document ref"
                  OnChange: =Patch('Questionnaire Items', ThisItem, {DocumentRef:txtDoc.Text})
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =12
                  Width: =200
                  X: =Parent.TemplateWidth - 440
                  Y: =106
            - txtOwn:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(230, 224, 210, 1)
                  BorderThickness: =1
                  Color: =RGBA(29, 37, 48, 1)
                  Default: =ThisItem.ResponsibleOwner
                  DisplayMode: =If(varSec.SectionStatus.Value in ["Submitted","Accepted"],DisplayMode.Disabled,DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HintText: ="Responsible owner (optional)"
                  OnChange: =Patch('Questionnaire Items', ThisItem, {ResponsibleOwner:txtOwn.Text})
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =12
                  Width: =206
                  X: =Parent.TemplateWidth - 230
                  Y: =106
      - btnRefresh:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(184, 151, 90, 1)
            BorderThickness: =1
