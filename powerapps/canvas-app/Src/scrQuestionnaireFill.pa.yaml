            Color: =RGBA(18, 35, 59, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Segoe UI'
            Height: =32
            HoverColor: =RGBA(18, 35, 59, 1)
            HoverFill: =RGBA(251, 249, 243, 1)
            OnSelect: =Navigate(scrMyQuestionnaires, ScreenTransition.None)
            PressedColor: =RGBA(18, 35, 59, 1)
            PressedFill: =RGBA(251, 249, 243, 1)
