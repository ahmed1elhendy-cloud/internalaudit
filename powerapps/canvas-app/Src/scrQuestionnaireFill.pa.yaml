Screens:
  scrQuestionnaireFill:
    Properties:
      Fill: =RGBA(247,244,236,1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - recHeader_4:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(18, 35, 59, 1)
            Height: =86
            Width: =Parent.Width
      - recGold_4:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(184, 151, 90, 1)
            Height: =2
            Width: =Parent.Width
            Y: =86
      - lblBrand_4:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(247, 244, 236, 1)
            Font: =Font.Georgia
            Height: =28
            Size: =20
            Text: ="MHAO"
            Width: =300
            X: =24
            Y: =6
      - lblBrandSub_4:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(184, 151, 90, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =16
            Size: =9
            Text: ="INTERNAL AUDIT PORTAL"
            Width: =300
            X: =24
            Y: =32
      - lblUser_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(217, 199, 158, 1)
            Font: =Font.'Segoe UI'
            Height: =24
            Size: =11
            Text: =User().FullName
            Width: =400
            X: =Parent.Width - 424
            Y: =16
      - galNav_4:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Height: =34
            Items: =Filter(Table({Value:"Dashboard",Show:true},{Value:"Plan",Show:varIsAuditor||varIsExec},{Value:"Engagements",Show:varIsAuditor||varIsExec},{Value:"Questionnaires",Show:varIsAuditor||varIsExec},{Value:"My Questionnaires",Show:varIsAuditee||varIsAuditor},{Value:"Fieldwork",Show:varIsAuditor},{Value:"Findings",Show:true},{Value:"Actions",Show:true},{Value:"Follow-Up",Show:varIsAuditor||varIsExec||varIsBUHead||varIsDeptHead},{Value:"Reports",Show:true},{Value:"Resource Centre",Show:varIsAuditor}),Show)
            OnSelect: =Switch(ThisItem.Value, "Dashboard", Navigate(scrDashboard, ScreenTransition.None), "Plan", Navigate(scrPlan, ScreenTransition.None), "Engagements", Navigate(scrEngagements, ScreenTransition.None), "Findings", Navigate(scrFindings, ScreenTransition.None), "Actions", Navigate(scrActions, ScreenTransition.None), "Follow-Up", Navigate(scrFollowUp, ScreenTransition.None), "Fieldwork", Navigate(scrFieldwork, ScreenTransition.None), "Questionnaires", Navigate(scrQuestionnaires, ScreenTransition.None), "My Questionnaires", Navigate(scrMyQuestionnaires, ScreenTransition.None), "Reports", Navigate(scrReports, ScreenTransition.None), "Resource Centre", Navigate(scrResources, ScreenTransition.None))
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =121
            Width: =Parent.Width - 32
            X: =16
            Y: =52
          Children:
            - lblTab_4:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(ThisItem.Value="My Questionnaires",RGBA(247, 244, 236, 1),RGBA(174, 184, 198, 1))
                  Fill: =If(ThisItem.Value="My Questionnaires",RGBA(27, 50, 80, 1),RGBA(0, 0, 0, 0))
                  Font: =Font.'Segoe UI'
                  Height: =34
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.Value
                  Width: =Parent.TemplateWidth
            - recTabLine_4:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(247, 244, 236, 1)
                  Height: =2
                  Visible: =ThisItem.Value="My Questionnaires"
                  Width: =Parent.TemplateWidth
                  Y: =32
      - lblTitle_5:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(29, 37, 48, 1)
            Font: =Font.Georgia
            Height: =34
            Size: =24
            Text: =varSec.Title
            Width: =Parent.Width - 200
            X: =24
            Y: =96
      - lblSub_4:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Segoe UI'
            Height: =20
            Size: =12
            Text: ="Answer every question. Attach evidence where required."
            Width: =Parent.Width - 200
            X: =24
            Y: =130
      - btnBack_2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(184, 151, 90, 1)
