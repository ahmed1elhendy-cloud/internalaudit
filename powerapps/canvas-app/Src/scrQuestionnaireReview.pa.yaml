              =With({q: Coalesce(varQItem, galRev.Selected), e: LookUp('Audit Engagements', ID = varQ.Engagement.Id)}, Set(varFindingItem, Patch('Audit Findings Register', Defaults('Audit Findings Register'), {'Finding Title': "Questionnaire exception " & q.Ref & ": " & q.Question, Engagement: varQ.Engagement, Entity: First(e.Entity), Observation: "Question: " & q.Question & Char(10) & "Answer: " & q.Answer.Value & Char(10) & If(!IsBlank(q.Explanation), "Explanation: " & q.Explanation & Char(10), "") & If(!IsBlank(q.'Reviewer Comment'), "Reviewer comment: " & q.'Reviewer Comment', ""), Rating: {Value: "Medium"}, 'Workflow Stage': {Value: "Draft"}})); Patch('Questionnaire Items', q, {'Finding Raised': {Id: varFindingItem.ID, Value: varFindingItem.'Finding Title'}})); EditForm(frmFinding); Navigate(scrFindingForm, ScreenTransition.None)
