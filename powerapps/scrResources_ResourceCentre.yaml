- btnRC01:
    Control: Classic/Button
    Properties:
      Text: |-
        =With({r: LookUp('Knowledge Index', Title = "Internal Audit Charter")}, r.Title & Char(10) & r.Description)
      X: =16
      Y: =134
      Width: =257
      Height: =92
      Size: =12
      BorderThickness: =0
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      Fill: |-
        =If(IsBlank(LookUp('Knowledge Index', Title = "Internal Audit Charter").DocLink), RGBA(110, 120, 145, 1), RGBA(31, 42, 68, 1))
      HoverFill: =RGBA(52, 68, 108, 1)
      Color: =RGBA(255, 255, 255, 1)
      OnSelect: |-
        =With({r: LookUp('Knowledge Index', Title = "Internal Audit Charter")}, If(IsBlank(r.DocLink), Notify("Coming soon - document not uploaded yet", NotificationType.Information), Launch(r.DocLink)))
